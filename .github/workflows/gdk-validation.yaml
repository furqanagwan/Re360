name: Windows GDK validation

on: [pull_request, push]

permissions:
  contents: read

concurrency:
  group: gdk-software-${{ github.event.pull_request.head.repo.full_name || github.repository }}-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  software:
    name: GDK software checks
    runs-on: windows-2025-vs2026
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive
      - name: Install build tools
        run: choco install llvm cmake ninja -y
      - name: Select the pinned PC GDK
        shell: pwsh
        run: |
          $gdkRoot = & ./scripts/setup_gdk.ps1 -Destination (Join-Path $env:RUNNER_TEMP 'gdk260404')
          "GameDKCoreLatest=$gdkRoot" >> $env:GITHUB_ENV
      - name: Build and test Debug and Release
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $vsWhere = "${env:ProgramFiles(x86)}/Microsoft Visual Studio/Installer/vswhere.exe"
          $vsInstall = & $vsWhere -latest -property installationPath
          & "$vsInstall/Common7/Tools/Launch-VsDevShell.ps1" -Arch amd64 -HostArch amd64 -SkipAutomaticLocation
          cmake --preset win-amd64-gdk -DREXGLUE_BUILD_TESTS=ON
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          foreach ($configuration in @('debug', 'release')) {
            cmake --build --preset "win-amd64-gdk-$configuration" --parallel 4
            if ($LASTEXITCODE) { exit $LASTEXITCODE }
            # Hosted runners are not installed-game or vendor/interactive gates.
            # Keep pure GDK ABI/mapping tests; exclude only installed runtime cases.
            ctest --preset "win-amd64-gdk-$configuration" --output-on-failure --no-tests=error -L '^(unit|ppc)$' -LE '^installed_runtime$'
            if ($LASTEXITCODE) { exit $LASTEXITCODE }
          }

  sanitizers:
    name: AddressSanitizer and parser fuzzing
    runs-on: windows-2025-vs2026
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive
      # LLVM pinned: the runner's preinstalled 20.1.8 crashes in C++ exception
      # dispatch under AddressSanitizer (four unit tests that throw across
      # rexruntime.dll); 22.1.8 passes them. See research/language/asan-llvm-version.md.
      - name: Install build tools
        run: |
          choco upgrade llvm --version=22.1.8 --allow-downgrade -y
          choco install cmake ninja -y
      - name: Select the pinned PC GDK
        shell: pwsh
        run: |
          $gdkRoot = & ./scripts/setup_gdk.ps1 -Destination (Join-Path $env:RUNNER_TEMP 'gdk260404')
          "GameDKCoreLatest=$gdkRoot" >> $env:GITHUB_ENV
      - name: Unit tests under AddressSanitizer, then 30 seconds per fuzz target
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $vsWhere = "${env:ProgramFiles(x86)}/Microsoft Visual Studio/Installer/vswhere.exe"
          $vsInstall = & $vsWhere -latest -property installationPath
          & "$vsInstall/Common7/Tools/Launch-VsDevShell.ps1" -Arch amd64 -HostArch amd64 -SkipAutomaticLocation
          clang++ --version
          cmake --preset win-amd64-gdk-asan
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          cmake --build --preset win-amd64-gdk-asan-release --target unit_tests --parallel 4
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          ctest --preset win-amd64-gdk-asan-release --output-on-failure --no-tests=error -L '^unit$' -LE '^installed_runtime$'
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          cmake --preset win-amd64-gdk-fuzz -DREXGLUE_FUZZ_SECONDS=30
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          cmake --build --preset win-amd64-gdk-fuzz-release --parallel 4
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          ctest --preset win-amd64-gdk-fuzz-release --output-on-failure --no-tests=error -L '^fuzz$'
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
